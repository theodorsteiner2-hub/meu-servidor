<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>WhatsApp Real-Time com Lista</title>
    <style>
        /* Mantive seu estilo e adicionei a lista de contatos */
        body { background: #111b21; color: #fff; display: flex; height: 100vh; font-family: sans-serif; }
        .sidebar { width: 300px; background: #202c33; padding: 20px; overflow-y: auto; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #efeae2; }
        .contact { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #333; cursor: pointer; }
        .contact img { width: 40px; height: 40px; border-radius: 50%; }
        #messagesContainer { flex: 1; padding: 20px; overflow-y: auto; color: #000; }
        .input-area { padding: 20px; display: flex; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>Seu Perfil</h3>
    <input type="text" id="userName" placeholder="Seu nome">
    <button onclick="registrarUsuario()">Entrar/Atualizar</button>
    <hr style="margin: 20px 0;">
    <h3>Contatos Online</h3>
    <div id="contactList"></div>
</div>

<div class="chat-area">
    <div id="messagesContainer"></div>
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Mensagem...">
        <button onclick="enviarMensagem()">Enviar</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyQgKBcblzkneOqTyt-qpD0U85iqFG076k",
        authDomain: "chatapp-c7bb1.firebaseapp.com",
        databaseURL: "https://chatapp-c7bb1-default-rtdb.firebaseio.com",
        projectId: "chatapp-c7bb1",
        storageBucket: "chatapp-c7bb1.firebasestorage.app",
        messagingSenderId: "463389637554",
        appId: "1:463389637554:web:e2657bc2287391dbc442ab"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    // Referências
    const chatRef = ref(db, 'mensagens');
    const usersRef = ref(db, 'usuarios');

    // 1. Registrar usuário no Firebase (para aparecer na lista)
    window.registrarUsuario = () => {
        const nome = document.getElementById('userName').value;
        if (!nome) return alert("Digite um nome!");
        
        // Salva o usuário no banco (usando o nome como ID simples)
        set(ref(db, 'usuarios/' + nome), {
            nome: nome,
            status: "Online"
        });
        alert("Você entrou no chat!");
    };

    // 2. Ouvir novos usuários e atualizar a lista
    onChildAdded(usersRef, (data) => {
        const user = data.val();
        const list = document.getElementById('contactList');
        const div = document.createElement('div');
        div.className = 'contact';
        div.innerHTML = `<img src="https://ui-avatars.com/api/?name=${user.nome}"> <span>${user.nome}</span>`;
        list.appendChild(div);
    });

    // 3. Enviar mensagem
    window.enviarMensagem = () => {
        const nome = document.getElementById('userName').value || "Anônimo";
        const input = document.getElementById('messageInput');
        push(chatRef, { autor: nome, texto: input.value });
        input.value = '';
    };

    // 4. Receber mensagens
    onChildAdded(chatRef, (data) => {
        const msg = data.val();
        const container = document.getElementById('messagesContainer');
        container.innerHTML += `<div><b>${msg.autor}:</b> ${msg.texto}</div>`;
    });
</script>

</body>
</html>
