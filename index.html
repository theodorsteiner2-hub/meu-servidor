<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp AI - RealTime</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #111b21; color: #e9edef; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100%; max-width: 900px; height: 95vh; background: #222d34; display: flex; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .sidebar { width: 320px; background: #111b21; border-right: 1px solid #222d34; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: #202c33; display: flex; align-items: center; gap: 15px; }
        .sidebar-header img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #555; }
        .sidebar-body { padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 12px; color: #00a884; }
        .form-group input, .form-group select { padding: 8px; border-radius: 5px; border: none; background: #2a3942; color: #fff; }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #efeae2; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        .chat-header { padding: 10px 20px; background: #202c33; color: #fff; display: flex; align-items: center; justify-content: space-between; }
        .chat-header-info { display: flex; align-items: center; gap: 15px; }
        
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-wrapper { display: flex; flex-direction: column; max-width: 65%; position: relative; }
        .message-wrapper.incoming { align-self: flex-start; }
        .message-wrapper.outgoing { align-self: flex-end; }
        
        .message { padding: 8px 12px; border-radius: 7.5px; font-size: 14px; word-wrap: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); color: #111; }
        .message.incoming { background: #fff; border-top-left-radius: 0; }
        .message.outgoing { background: #d9fdd3; border-top-right-radius: 0; }
        .message .time { font-size: 10px; color: #666; float: right; margin-left: 10px; margin-top: 5px; }

        .chat-input-area { padding: 10px 20px; background: #202c33; display: flex; align-items: center; gap: 10px; }
        .chat-input-area input[type="text"] { flex: 1; padding: 10px 15px; border-radius: 8px; border: none; background: #2a3942; color: #fff; outline: none; }
        .btn-action { background: none; border: none; color: #8696a0; font-size: 20px; cursor: pointer; }
        .btn-action:hover { color: #00a884; }
        
        .ai-suggestions { padding: 10px 20px; background: #111b21; display: flex; gap: 10px; overflow-x: auto; border-top: 1px solid #222d34; }
        .suggestion-chip { background: #202c33; color: #00a884; border: 1px solid #00a884; padding: 5px 10px; border-radius: 15px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .suggestion-chip:hover { background: #00a884; color: #fff; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <img id="myPicPreview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Perfil">
            <div>
                <h4 id="myNameDisplay">Meu Perfil</h4>
                <small style="color: #8696a0;">Conectado</small>
            </div>
        </div>
        <div class="sidebar-body">
            <div class="form-group">
                <label>Chave OpenRouter API (Opcional)</label>
                <input type="password" id="apiKey" placeholder="sk-or-v1-...">
            </div>
            <div class="form-group">
                <label>Seu Nome</label>
                <input type="text" id="userName" value="Visitante" placeholder="Seu nome">
            </div>
            <div class="form-group">
                <label>Foto de Perfil (URL)</label>
                <input type="text" id="userPic" value="https://cdn-icons-png.flaticon.com/512/149/149071.png">
            </div>
            <div class="form-group">
                <label>Modelo da IA</label>
                <select id="aiModel">
                    <option value="meta-llama/llama-3-8b-instruct:free">Llama 3 8B (Gratuito)</option>
                    <option value="deepseek/deepseek-chat">DeepSeek V3</option>
                </select>
            </div>
            <button onclick="salvarPerfil()" style="padding: 10px; background: #00a884; color: #fff; border:none; border-radius: 5px; cursor: pointer; font-weight: bold;">Salvar Configurações</button>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <div class="chat-header-info">
                <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" style="width:40px; height:40px; border-radius:50%;">
                <div>
                    <h3 id="chatTitle">Chat Global & IA</h3>
                    <small style="color: #00a884;">online</small>
                </div>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer"></div>

        <div class="ai-suggestions" id="aiSuggestions">
            <div class="suggestion-chip" onclick="usarSugestao('Olá pessoal, tudo bem?')">👋 Olá pessoal</div>
            <div class="suggestion-chip" onclick="usarSugestao('Pode me ajudar com uma correção de texto?')">✍️ Corrigir texto</div>
            <div class="suggestion-chip" onclick="usarSugestao('Me dê dicas de escrita criativa.')">💡 Dicas de escrita</div>
        </div>

        <div class="chat-input-area">
            <button class="btn-action" title="Enviar Imagem" onclick="enviarMidia('imagem')">📷</button>
            <button class="btn-action" title="Enviar Áudio" onclick="enviarMidia('audio')">🎤</button>
            <input type="text" id="messageInput" placeholder="Digite uma mensagem..." onkeypress="if(event.key === 'Enter') enviarMensagem()">
            <button class="btn-action" title="Enviar" onclick="enviarMensagem()">➤</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // --- CHAVES DO FIREBASE JÁ INCLUÍDAS ---
    const firebaseConfig = {
        apiKey: "AIzaSyQgKBcblzkneOqTyt-qpD0U85iqFG076k",
        authDomain: "chatapp-c7bb1.firebaseapp.com",
        databaseURL: "https://chatapp-c7bb1-default-rtdb.firebaseio.com",
        projectId: "chatapp-c7bb1",
        storageBucket: "chatapp-c7bb1.firebasestorage.app",
        messagingSenderId: "463389637554",
        appId: "1:463389637554:web:e2657bc2287391dbc442ab"
    };
    // ---------------------------------------------

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'mensagens');

    let primeiraMensagemEnviada = false;

    window.salvarPerfil = function() {
        const name = document.getElementById('userName').value;
        const pic = document.getElementById('userPic').value;
        document.getElementById('myNameDisplay').innerText = name;
        document.getElementById('myPicPreview').src = pic;
        alert("Perfil salvo!");
    }

    window.usarSugestao = function(texto) {
        document.getElementById('messageInput').value = texto;
    }

    window.enviarMensagem = async function() {
        const input = document.getElementById('messageInput');
        const apiKey = document.getElementById('apiKey').value;
        const model = document.getElementById('aiModel').value;
        const nome = document.getElementById('userName').value;
        const texto = input.value.trim();

        if (!texto) return;

        push(chatRef, { autor: nome, texto: texto });
        input.value = '';

        if (apiKey) {
            try {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": model,
                        "messages": [
                            {"role": "system", "content": "Você é uma IA assistente prestativa em um chat em grupo."},
                            {"role": "user", "content": texto}
                        ]
                    })
                });
                const data = await res.json();
                if (data.choices && data.choices.length > 0) {
                    const respostaAI = data.choices[0].message.content;
                    push(chatRef, { autor: "Assistente IA", texto: respostaAI });
                }
            } catch (e) {
                console.error("Erro ao chamar IA");
            }
        }
    }

    window.enviarMidia = function(tipoMidia) {
        const nome = document.getElementById('userName').value;
        const texto = tipoMidia === 'imagem' ? "📷 [Imagem enviada]" : "🎤 [Áudio gravado]";
        push(chatRef, { autor: nome, texto: texto });
    }

    onChildAdded(chatRef, (data) => {
        if (!primeiraMensagemEnviada) {
            document.getElementById('messagesContainer').style.display = 'flex';
            primeiraMensagemEnviada = true;
        }

        const msg = data.val();
        const container = document.getElementById('messagesContainer');
        const wrapper = document.createElement('div');
        
        const meuNome = document.getElementById('userName').value;
        const isMe = msg.autor === meuNome;
        wrapper.className = `message-wrapper ${isMe ? 'outgoing' : 'incoming'}`;
        
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isMe ? 'outgoing' : 'incoming'}`;
        
        const hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        msgDiv.innerHTML = `<b>${msg.autor}</b><br>${msg.texto} <span class="time">${hora}</span>`;
        wrapper.appendChild(msgDiv);
        container.appendChild(wrapper);
        container.scrollTop = container.scrollHeight;
    });
</script>

</body>
</html>
