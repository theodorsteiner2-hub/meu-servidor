<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web - Chat Privado</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
        body { background-color: #0c1317; color: #e9edef; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 1600px; height: 100vh; background: #222d34; display: flex; position: relative; overflow: hidden; box-shadow: 0 1px 1px 0 rgba(0,0,0,.06),0 2px 5px 0 rgba(0,0,0,.2); }
        
        @media (min-width: 1400px) {
            .app-container { height: 95vh; width: 95vw; }
        }

        /* Sidebar / Painel Esquerdo */
        .sidebar { width: 100%; max-width: 400px; background: #111b21; border-right: 1px solid #222d34; display: flex; flex-direction: column; z-index: 2; height: 100%; }
        .sidebar-header { padding: 10px 16px; background: #202c33; display: flex; align-items: center; justify-content: space-between; height: 60px; }
        .user-profile { display: flex; align-items: center; gap: 15px; }
        .user-profile img, .contact img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #555; }
        
        .contact-list { flex: 1; overflow-y: auto; background: #111b21; }
        .contact { display: flex; align-items: center; gap: 15px; padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #222d34; transition: background 0.2s; }
        .contact:hover { background: #202c33; }
        .contact.active { background: #2a3942; }
        .contact-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .contact-name { font-size: 16px; color: #e9edef; }
        .contact-status { font-size: 13px; color: #8696a0; }

        /* Área de Chat Principal */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #efeae2; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); height: 100%; position: relative; }
        .chat-header { padding: 10px 16px; background: #202c33; color: #fff; display: flex; align-items: center; justify-content: space-between; height: 60px; z-index: 1; }
        .chat-header-info { display: flex; align-items: center; gap: 15px; }
        .chat-header-info img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        
        .messages-container { flex: 1; padding: 20px 7%; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .message-wrapper { display: flex; flex-direction: column; max-width: 65%; position: relative; margin-bottom: 2px; }
        .message-wrapper.incoming { align-self: flex-start; }
        .message-wrapper.outgoing { align-self: flex-end; }
        
        .message { padding: 6px 7px 8px 9px; border-radius: 7.5px; font-size: 14.2px; word-wrap: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); color: #111; line-height: 19px; position: relative; }
        .message.incoming { background: #fff; border-top-left-radius: 0; }
        .message.outgoing { background: #d9fdd3; border-top-right-radius: 0; }
        .message .time { font-size: 11px; color: #667781; float: right; margin-left: 15px; margin-top: 4px; line-height: 15px; }

        /* Tela de Boas-vindas (Nenhum chat selecionado) */
        .no-chat-selected { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f0f2f5; color: #41525d; text-align: center; padding: 20px; }
        .no-chat-selected h2 { font-weight: 300; font-size: 32px; margin-bottom: 10px; color: #41525d; }
        .no-chat-selected p { font-size: 14px; color: #667781; max-width: 460px; line-height: 20px; }

        /* Barra de Entrada / Input */
        .chat-input-area { padding: 10px 16px; background: #202c33; display: flex; align-items: center; gap: 10px; min-height: 62px; }
        .chat-input-area input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 8px; border: none; background: #2a3942; color: #fff; outline: none; font-size: 15px; }
        .chat-input-area input[type="text"]::placeholder { color: #8696a0; }
        .btn-action { background: none; border: none; color: #8696a0; font-size: 22px; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; }
        .btn-action:hover { color: #00a884; }

        /* Responsividade para Celulares */
        @media (max-width: 768px) {
            .app-container { flex-direction: column; height: 100vh; width: 100vw; }
            .sidebar { width: 100%; height: 100%; position: absolute; top: 0; left: 0; transition: transform 0.3s ease; z-index: 10; }
            .sidebar.hidden { transform: translateX(-100%); }
            .chat-area { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 5; display: none; }
            .chat-area.active { display: flex; }
            .messages-container { padding: 10px 3%; }
            .message-wrapper { max-width: 85%; }
        }
        
        .back-to-menu { display: none; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; margin-right: 5px; }
        @media (max-width: 768px) {
            .back-to-menu { display: block; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Painel Lateral (Contatos e Perfil) -->
    <div class="sidebar" id="sidebarPanel">
        <div class="sidebar-header">
            <div class="user-profile">
                <img id="myPicPreview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Perfil">
                <span id="myNameDisplay" style="font-weight: 500; font-size: 16px;">Meu Perfil</span>
            </div>
        </div>

        <div style="padding: 10px 15px; font-size: 13px; color: #00a884; font-weight: bold; background: #111b21; border-bottom: 1px solid #222d34;">CONVERSAS DISPONÍVEIS</div>
        <div class="contact-list" id="contactList">
            <!-- Lista dinâmica de usuários preenchida pelo Firebase -->
        </div>
    </div>

    <!-- Área Principal de Conversa (Inicialmente oculta ou tela vazia até selecionar alguém) -->
    <div class="chat-area" id="chatAreaContainer">
        <div id="noChatState" class="no-chat-selected">
            <h2>WhatsApp Web</h2>
            <p>Envie e receba mensagens de forma privada. Selecione um contato na barra lateral esquerda para iniciar uma conversa direta.</p>
        </div>

        <div id="activeChatState" style="display: none; flex: 1; flex-direction: column; height: 100%;">
            <div class="chat-header">
                <div class="chat-header-info">
                    <button class="back-to-menu" onclick="voltarParaLista()">⬅</button>
                    <img id="activeChatPic" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Contato">
                    <div>
                        <h3 id="chatTitle" style="font-size: 16px; font-weight: 500;">Nome do Contato</h3>
                        <small style="color: #8696a0; font-size: 12px;" id="onlineSub">online</small>
                    </div>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer"></div>

            <!-- Input de Mensagens -->
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Digite uma mensagem" onkeypress="if(event.key === 'Enter') enviarMensagem()">
                <button class="btn-action" title="Enviar" onclick="enviarMensagem()" style="color: #00a884; font-size: 24px;">➤</button>
            </div>
        </div>
    </div>
</div>

<!-- Som de notificação do WhatsApp via Web Audio API -->
<script>
    function tocarSomNotificacao() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } catch (e) {
            console.log("Áudio bloqueado até interagir com a página.");
        }
    }

    function voltarParaLista() {
        document.getElementById('sidebarPanel').classList.remove('hidden');
        document.getElementById('chatAreaContainer').classList.remove('active');
    }
</script>

<!-- Lógica Firebase e Chat Privado -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set, onChildRemoved } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyQgKBcblzkneOqTyt-qpD0U85iqFG076k",
        authDomain: "chatapp-c7bb1.firebaseapp.com",
        databaseURL: "https://chatapp-c7bb1-default-rtdb.firebaseio.com",
        projectId: "chatapp-c7bb1",
        storageBucket: "chatapp-c7bb1.firebasestorage.app",
        messagingSenderId: "463389637554",
        appId: "1:463389637554:web:e2657bc2287391dbc442ab"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const usersRef = ref(db, 'usuarios');

    // Identificação automática ou recuperação via localStorage (Não pede para registrar toda vez)
    let meuNome = localStorage.getItem('chat_usuario_nome');
    if (!meuNome) {
        meuName = prompt("Digite o seu nome para entrar no chat:") || ("Usuário_" + Math.floor(Math.random() * 1000));
        localStorage.setItem('chat_usuario_nome', meuName);
    }
    const minhaFoto = "https://ui-avatars.com/api/?name=" + encodeURIComponent(meuName) + "&background=random";
    
    document.getElementById('myNameDisplay').innerText = meuNome;
    document.getElementById('myPicPreview').src = minhaFoto;

    // Salva o usuário automaticamente no Firebase ao abrir o site
    set(ref(db, 'usuarios/' + meuName), {
        nome: meuName,
        foto: minhaFoto
    });

    let contatoAtual = null;
    let chatIdAtual = null;
    let listenerMensagensAtual = null;

    // Função para gerar uma chave única e organizada para a conversa privada entre dois usuários
    function obterChatId(usuarioA, usuarioB) {
        return [usuarioA, usuarioB].sort().join('_vs_');
    }

    // Monitora usuários para preencher a lista lateral
    onChildAdded(usersRef, (data) => {
        const user = data.val();
        if (user.nome === meuNome) return; // Não exibe a si mesmo na lista de contatos

        const list = document.getElementById('contactList');
        if (document.getElementById('user-item-' + user.nome)) return;
        
        const div = document.createElement('div');
        div.className = 'contact';
        div.id = 'user-item-' + user.nome;
        div.innerHTML = `
            <img src="${user.foto}" alt="Foto">
            <div class="contact-info">
                <span class="contact-name">${user.nome}</span>
                <span class="contact-status">Online</span>
            </div>
        `;
        
        // Ao clicar no contato, abre a conversa estritamente direta (privada)
        div.onclick = () => {
            document.querySelectorAll('.contact').forEach(c => c.classList.remove('active'));
            div.classList.add('active');
            abrirConversaPrivada(user);
        };

        list.appendChild(div);
    });

    window.abrirConversaPrivada = function(user) {
        contatoAtual = user;
        chatIdAtual = obterChatId(meuNome, user.nome);

        document.getElementById('noChatState').style.display = 'none';
        document.getElementById('activeChatState').style.display = 'flex';
        document.getElementById('chatTitle').innerText = user.nome;
        document.getElementById('activeChatPic').src = user.foto;
        document.getElementById('messagesContainer').innerHTML = '';

        if (window.innerWidth <= 768) {
            document.getElementById('sidebarPanel').classList.add('hidden');
            document.getElementById('chatAreaContainer').classList.add('active');
        }

        // Carrega as mensagens específicas desta conversa privada
        const chatPrivadoRef = ref(db, 'chats_privados/' + chatIdAtual);
        
        // Limpa listener anterior se houver (para evitar duplicar mensagens ao trocar de contato)
        document.getElementById('messagesContainer').innerHTML = '';

        onChildAdded(chatPrivadoRef, (msgData) => {
            const msg = msgData.val();
            renderizarMensagem(msg);
        });
    }

    window.enviarMensagem = function() {
        const input = document.getElementById('messageInput');
        const texto = input.value.trim();
        if (!texto || !chatIdAtual) return;

        const chatPrivadoRef = ref(db, 'chats_privados/' + chatIdAtual);
        push(chatPrivadoRef, {
            autor: meuNome,
            texto: texto,
            timestamp: Date.now()
        });

        input.value = '';
    }

    function renderizarMensagem(msg) {
        const container = document.getElementById('messagesContainer');
        const wrapper = document.createElement('div');
        
        const isMe = msg.autor === meuNome;
        wrapper.className = `message-wrapper ${isMe ? 'outgoing' : 'incoming'}`;
        
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isMe ? 'outgoing' : 'incoming'}`;
        
        const hora = new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        msgDiv.innerHTML = `${msg.texto} <span class="time">${hora}</span>`;
        
        wrapper.appendChild(msgDiv);
        container.appendChild(wrapper);
        container.scrollTop = container.scrollHeight;

        // Toca o som se a mensagem veio de outra pessoa e o chat está aberto
        if (!isMe) {
            tocarSomNotificacao();
        }
    }
</script>

</body>
</html>
